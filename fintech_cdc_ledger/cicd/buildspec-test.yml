version: 0.2
# Test stage: this is the pipeline's gate. If a DAG has a syntax error or
# a missing import, this fails and Deploy never runs — the exact "problems
# in an early stage stop the code from progressing" principle from the
# AWS CI/CD reference pattern.

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      # must match the Airflow version the DAG is actually written for
      # (Airflow 3's Task SDK style, `from airflow.sdk import ...` — same
      # version as 3_labs/airflow_local's Docker image) — Airflow 2.10.3
      # doesn't have the airflow.sdk module at all and fails every import.
      - pip install --quiet "apache-airflow==3.3.1" "apache-airflow-providers-amazon" "apache-airflow-providers-standard"
  build:
    commands:
      - echo "Checking every DAG file compiles..."
      - python -m py_compile fintech_cdc_ledger/airflow/dags/*.py
      - echo "Checking Airflow can actually parse the DAG (catches import
         errors py_compile can't see, e.g. a missing operator)..."
      - export AIRFLOW_HOME=/tmp/airflow_test
      - export AIRFLOW__CORE__LOAD_EXAMPLES=false
      - mkdir -p $AIRFLOW_HOME/dags
      - cp fintech_cdc_ledger/airflow/dags/*.py $AIRFLOW_HOME/dags/
      - airflow db migrate   # Airflow 3 replaced "db init" with "db migrate"
      - |
        python -c "
        from airflow.models import DagBag
        # Airflow 3 dropped DagBag's include_examples kwarg — controlled by
        # AIRFLOW__CORE__LOAD_EXAMPLES instead (set above).
        bag = DagBag(dag_folder='$AIRFLOW_HOME/dags')
        if bag.import_errors:
            for f, err in bag.import_errors.items():
                print(f'DAG IMPORT ERROR in {f}: {err}')
            raise SystemExit(1)
        print(f'{len(bag.dags)} DAG(s) parsed cleanly: {list(bag.dags.keys())}')
        "
